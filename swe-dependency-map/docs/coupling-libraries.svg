<text x="225" y="603" text-anchor="middle" font-size="12">0.25</text>
<text x="84" y="457" text-anchor="end" font-size="12">0.25</text>
<path d="M 350 78 V 578 M 100 328 H 600" fill="none" stroke="#a5b3c5" stroke-opacity="0.5"/>
<text x="350" y="603" text-anchor="middle" font-size="12">0.5</text>
<text x="84" y="332" text-anchor="end" font-size="12">0.5</text>
<path d="M 475 78 V 578 M 100 203 H 600" fill="none" stroke="#a5b3c5" stroke-opacity="0.5"/>
