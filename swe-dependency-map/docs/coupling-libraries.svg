<path d="M 600 78 V 578 M 100 78 H 600" fill="none" stroke="#a5b3c5" stroke-opacity="0.5"/>
<text x="600" y="603" text-anchor="middle" font-size="12">1</text>
<text x="84" y="82" text-anchor="end" font-size="12">1</text>
<rect x="100" y="78" width="500" height="500" fill="none" stroke="#536580"/>
<path d="M 100 578 L 600 78" fill="none" stroke="#536580" stroke-width="2" stroke-dasharray="7 5"/>
<text x="350" y="632" text-anchor="middle" font-size="15">Instabilidade (I) →</text>
<text transform="translate(34 328) rotate(-90)" text-anchor="middle" font-size="15">Abstração (A) →</text>
